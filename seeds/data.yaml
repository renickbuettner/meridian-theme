# Generated by scripts/build-seeds.mjs from seeds/data.d/*.yaml. Do not edit by hand.
# Meridian seed instructions: `php artisan theme:seed <theme-folder>` (`meridian` here, `renick-meridian` on a Marketplace install; `php artisan theme:list` prints it).
# The meridian-en (root) and meridian-de (/de) sites are created by the first step; every content step names its site and skips its rows when it is missing.
# Idempotent via update_existing; DE rows carry site_root_id pointing at their EN row.

# --- 00-sites.yaml ---
- name: Sites (EN root + DE)
  class: Renick\Content\Models\SiteDefinitionImport
  file: seeds/data/sites.json
  attributes:
      file_format: json

# `{{ '…'|_ }}` strings from translate/*.yaml; `translate:scan` imports nothing on a CLI install, so seed them here.
- name: Frontend messages (EN + DE + ES)
  class: Renick\Content\Models\ThemeMessageImport
  file: seeds/data/messages.json
  attributes:
      file_format: json

