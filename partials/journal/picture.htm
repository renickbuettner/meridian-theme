{# {% partial 'journal/picture' image=card.image sizes='...' width=640 height=400 alt='' eager=false %}: AVIF and WebP sources over a JPEG fallback, explicit size against layout shift. #}
{% if image.src %}
<picture>
    {% if image.avif %}<source type="image/avif" srcset="{{ image.avif }}" sizes="{{ sizes }}">{% endif %}
    {% if image.webp %}<source type="image/webp" srcset="{{ image.webp }}" sizes="{{ sizes }}">{% endif %}
    <img src="{{ image.src }}"{% if image.srcset %} srcset="{{ image.srcset }}" sizes="{{ sizes }}"{% endif %} alt="{{ alt }}" width="{{ width }}" height="{{ height }}"{% if eager %} fetchpriority="high"{% else %} loading="lazy" decoding="async"{% endif %}>
</picture>
{% endif %}
