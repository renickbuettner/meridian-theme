        size: small
      features:
        label: meridian.block.plan-teaser.plan_features
        type: textarea
        size: small
        commentAbove: meridian.block.plan-teaser.plan_features_comment
      featured:
        label: meridian.block.plan-teaser.plan_featured
        type: checkbox
      cta_label:
